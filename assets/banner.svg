<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" style="background: #0B0F19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A13" />
      <stop offset="50%" stop-color="#0E172A" />
      <stop offset="100%" stop-color="#070A13" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#C084FC;#38BDF8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#C084FC;#38BDF8;#818CF8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#C084FC">
        <animate attributeName="stop-color" values="#C084FC;#38BDF8;#818CF8;#C084FC" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="chartBar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="chartBar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38BDF8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Animated Glowing Orbs (Deep Background) -->
  <circle cx="200" cy="90" r="120" fill="#38BDF8" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cy" values="90;130;90" dur="10s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.10;0.18;0.10" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="1020" cy="310" r="150" fill="#818CF8" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cy" values="310;270;310" dur="12s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.10;0.18;0.10" dur="12s" repeatCount="indefinite" />
  </circle>

  <!-- Dynamic Dashboard Widget Previews (Subtle Background Elements) -->
  <!-- Floating Mini Card Left: KPI Widget -->
  <g transform="translate(60, 240)" opacity="0.85">
    <rect width="180" height="110" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
    <text x="18" y="32" fill="#94A3B8" font-size="12" font-weight="600">MONTHLY METRICS</text>
    <text x="18" y="68" fill="#F8FAFC" font-size="26" font-weight="800">$128.4K</text>
    <rect x="18" y="82" width="75" height="16" rx="8" fill="#065F46" />
    <text x="26" y="94" fill="#34D399" font-size="10" font-weight="700">▲ +24.8%</text>
  </g>

  <!-- Floating Mini Card Right: Metric Sparkline / Pulse -->
  <g transform="translate(960, 60)" opacity="0.85">
    <rect width="180" height="110" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
    <text x="18" y="32" fill="#94A3B8" font-size="12" font-weight="600">QUERY LATENCY</text>
    <text x="18" y="68" fill="#38BDF8" font-size="26" font-weight="800">12ms</text>
    <!-- Animated pulse dot -->
    <circle cx="150" cy="28" r="5" fill="#10B981">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <path d="M 18 95 Q 50 75, 80 90 T 140 70 T 162 75" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Animated Bottom Bar Chart (Background Decoration) -->
  <g transform="translate(350, 360)" opacity="0.4">
    <!-- Bars -->
    <rect x="0" y="-30" width="16" height="30" rx="3" fill="url(#chartBar1)">
      <animate attributeName="height" values="30;60;30" dur="4s" repeatCount="indefinite" />
      <animate attributeName="y" values="-30;-60;-30" dur="4s" repeatCount="indefinite" />
    </rect>
    <rect x="28" y="-55" width="16" height="55" rx="3" fill="url(#chartBar2)">
      <animate attributeName="height" values="55;35;55" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="-55;-35;-55" dur="3.5s" repeatCount="indefinite" />
    </rect>
    <rect x="56" y="-45" width="16" height="45" rx="3" fill="url(#chartBar1)">
      <animate attributeName="height" values="45;75;45" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="-45;-75;-45" dur="4.5s" repeatCount="indefinite" />
    </rect>
    <rect x="84" y="-70" width="16" height="70" rx="3" fill="url(#chartBar2)">
      <animate attributeName="height" values="70;40;70" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="-70;-40;-70" dur="3.8s" repeatCount="indefinite" />
    </rect>
    <rect x="112" y="-50" width="16" height="50" rx="3" fill="url(#chartBar1)">
      <animate attributeName="height" values="50;85;50" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="-50;-85;-50" dur="4.2s" repeatCount="indefinite" />
    </rect>
    <rect x="140" y="-80" width="16" height="80" rx="3" fill="url(#chartBar2)">
      <animate attributeName="height" values="80;50;80" dur="3.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="-80;-50;-80" dur="3.6s" repeatCount="indefinite" />
    </rect>
    <rect x="168" y="-60" width="16" height="60" rx="3" fill="url(#chartBar1)">
      <animate attributeName="height" values="60;90;60" dur="4s" repeatCount="indefinite" />
      <animate attributeName="y" values="-60;-90;-60" dur="4s" repeatCount="indefinite" />
    </rect>
    <rect x="196" y="-85" width="16" height="85" rx="3" fill="url(#chartBar2)">
      <animate attributeName="height" values="85;45;85" dur="4.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="-85;-45;-85" dur="4.8s" repeatCount="indefinite" />
    </rect>
    <rect x="224" y="-40" width="16" height="40" rx="3" fill="url(#chartBar1)">
      <animate attributeName="height" values="40;70;40" dur="3.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="-40;-70;-40" dur="3.3s" repeatCount="indefinite" />
    </rect>
    <rect x="252" y="-95" width="16" height="95" rx="3" fill="url(#chartBar2)">
      <animate attributeName="height" values="95;65;95" dur="4.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="-95;-65;-95" dur="4.1s" repeatCount="indefinite" />
    </rect>
    <rect x="280" y="-75" width="16" height="75" rx="3" fill="url(#chartBar1)">
      <animate attributeName="height" values="75;105;75" dur="3.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="-75;-105;-75" dur="3.9s" repeatCount="indefinite" />
    </rect>
    <rect x="308" y="-90" width="16" height="90" rx="3" fill="url(#chartBar2)">
      <animate attributeName="height" values="90;60;90" dur="4.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="-90;-60;-90" dur="4.4s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Foreground Content: Header Badge, Title & Subtitle (Always Clear and Unobstructed) -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Category Pill Badge -->
    <rect x="-190" y="0" width="380" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="-165" cy="16" r="5" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="10" y="21" fill="#94A3B8" font-size="13" font-weight="600" letter-spacing="1">CURATED OPEN-SOURCE &amp; SAAS DIRECTORY</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <text fill="url(#titleGrad)" font-size="44" font-weight="900" letter-spacing="-0.5">Awesome Configurable</text>
    <text y="52" fill="url(#titleGrad)" font-size="44" font-weight="900" letter-spacing="-0.5">Business Dashboard Builder</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 260)" text-anchor="middle">
    <text fill="#E2E8F0" font-size="18" font-weight="500">Drag-and-Drop Builders • Self-Service BI • Embedded Analytics • Modern Data Apps</text>
  </g>

  <!-- Feature Pills in Foreground -->
  <g transform="translate(600, 312)" text-anchor="middle">
    <g transform="translate(-320, 0)">
      <rect x="0" y="0" width="135" height="34" rx="17" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />
      <text x="67" y="21" fill="#38BDF8" font-size="12" font-weight="600" text-anchor="middle">⚡ Self-Hosted BI</text>
    </g>
    <g transform="translate(-165, 0)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#1E293B" stroke="#818CF8" stroke-opacity="0.4" stroke-width="1" />
      <text x="75" y="21" fill="#818CF8" font-size="12" font-weight="600" text-anchor="middle">📊 Drag &amp; Drop Editor</text>
    </g>
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="155" height="34" rx="17" fill="#1E293B" stroke="#A855F7" stroke-opacity="0.4" stroke-width="1" />
      <text x="77" y="21" fill="#C084FC" font-size="12" font-weight="600" text-anchor="middle">🔗 Semantic Metrics</text>
    </g>
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="145" height="34" rx="17" fill="#1E293B" stroke="#EC4899" stroke-opacity="0.4" stroke-width="1" />
      <text x="72" y="21" fill="#F472B6" font-size="12" font-weight="600" text-anchor="middle">🚀 Low-Code / APIs</text>
    </g>
  </g>
</svg>
